name: 功能建议
description: 提出一个新功能或改进建议。
title: "[建议] 请一句话描述你的建议"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你为 Vchange 提出的想法！请尽量清晰地描述你希望增加或改进的功能。

        > [!IMPORTANT]
        > 请**一个功能开一个 issue**。提交前请先在 [Issues](https://github.com/Andydot-ui/Vchange/issues?q=is%3Aissue) 中搜索是否已有相同建议。
  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前检查
      description: 在开始填写之前，请先确认：
      options:
        - label: 我已确认使用的是 [最新版本](https://github.com/Andydot-ui/Vchange/releases/latest)，并确认该功能尚未实现、也未在 Issues 中重复提交。
          required: true
        - label: 我已经详细阅读了选项内容，并知道未勾选必选项的 issue 可能会被直接关闭。
          required: true
  - type: textarea
    id: background
    attributes:
      label: 背景与动机
      description: 为什么你需要这个功能？它解决了什么问题？
    validations:
      required: true
  - type: textarea
    id: requested-feature
    attributes:
      label: 希望实现的功能
      description: 详细描述你希望增加或改进的功能。描述越具体、越清晰，被采纳的可能性越高。
    validations:
      required: true
  - type: textarea
    id: expected-effect
    attributes:
      label: 预期效果
      description: 如果可以，描述一下功能实现后的使用流程或界面效果。
      placeholder: |
        例如：在「视频参数」页面增加 xx 选项，选择后自动……
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 你是否考虑过其他替代方式来实现这个需求？
  - type: textarea
    id: screenshots
    attributes:
      label: 参考截图 / 链接（可选）
      description: 如果有其他软件的类似功能截图或参考链接，可以贴在这里。
  - type: checkboxes
    id: revision
    attributes:
      label: 最后确认
      description: 回顾你的回答
      options:
        - label: 我确认以上信息已经尽可能清晰，方便开发者理解这个建议。
          required: true
